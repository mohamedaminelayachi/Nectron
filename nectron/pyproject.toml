[project]
name = "nectron"
version = "0.1.0"
description = "The official package of the Nectron system, introduced in the paper: Neurosymbolic Implementation-Free Contracts Generation."
readme = "README.md"
requires-python = ">=3.14"
dependencies = [
    "dearpygui>=2.2",
    "google-generativeai>=0.8.6",
    "lark>=1.3.1",
    "lxml>=6.0.2",
    "openai>=2.25.0",
    "pandas>=3.0.1",
    "pyyaml>=6.0.3",
]
